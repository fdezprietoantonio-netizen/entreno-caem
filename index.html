<style>
/* Layout: app de una columna (máx. 960 px) con barra de pestañas fija arriba; cada pestaña es una vista (#semana, #ejercicios, #registro, #progreso, #pruebas) */
:root {
  --bg: #eef2f5; --panel: #ffffff; --panel2: #f6f8fa; --ink: #17212a; --muted: #5b6974; --line: #d5dde3;
  --rescue: #c94310; --rescue-soft: #fde6d8; --ice: #1d5f8a; --ice-soft: #dfedf6;
  --ok: #2b7a3b; --ok-soft: #e0f2e4; --warn: #9a6a12; --warn-soft: #faefd5; --bad: #c0302f; --bad-soft: #fbe3e3;
  --rock: #7a5a2e; --rock-soft: #f3eadb; --fig: #1f2b35; --fig2: #8b9aa6; --prop: #b6c2cb;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "Source Sans 3", system-ui, sans-serif;
  --f-data: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10161b; --panel: #18212a; --panel2: #1e2832; --ink: #e5ebef; --muted: #96a4ae; --line: #2d3a45;
  --rescue: #ff7e44; --rescue-soft: #3a2015; --ice: #7fbfe8; --ice-soft: #142838;
  --ok: #6fd884; --ok-soft: #15301d; --warn: #f0c358; --warn-soft: #33290f; --bad: #ff7272; --bad-soft: #3a1a1a;
  --rock: #d9b27a; --rock-soft: #33281a; --fig: #e5ebef; --fig2: #6f808d; --prop: #4a5966; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #10161b; --panel: #18212a; --panel2: #1e2832; --ink: #e5ebef; --muted: #96a4ae; --line: #2d3a45;
  --rescue: #ff7e44; --rescue-soft: #3a2015; --ice: #7fbfe8; --ice-soft: #142838;
  --ok: #6fd884; --ok-soft: #15301d; --warn: #f0c358; --warn-soft: #33290f; --bad: #ff7272; --bad-soft: #3a1a1a;
  --rock: #d9b27a; --rock-soft: #33281a; --fig: #e5ebef; --fig2: #6f808d; --prop: #4a5966; color-scheme: dark }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.wk-title .chip { justify-self: start; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; line-height: 1.05; text-wrap: balance; }
h2 { font-size: 1.7rem; text-transform: uppercase; letter-spacing: .01em; }
h3 { font-size: 1.2rem; }
p { margin: 0; max-width: 68ch; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.top-in { max-width: 960px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-block: 8px; }
.brand { font: 700 1.35rem var(--f-display); text-transform: uppercase; letter-spacing: .02em; }
.brand span { color: var(--rescue); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
nav.tabs a { text-decoration: none; color: var(--muted); font: 600 .9rem var(--f-body); padding: 8px 12px; border-radius: 4px; white-space: nowrap; }
nav.tabs a.on { color: var(--ink); background: var(--panel2); box-shadow: inset 0 -2px 0 var(--rescue); }
.sync { font: 500 .72rem var(--f-data); color: var(--muted); white-space: nowrap; }
main { max-width: 960px; margin: 0 auto; padding-block: 20px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.view { display: grid; gap: 18px; }
.lead { color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font: 600 .72rem var(--f-body); text-transform: uppercase; letter-spacing: .07em; padding: 3px 8px; border-radius: 3px; white-space: nowrap; }
.c-base { background: var(--ice-soft); color: var(--ice); } .c-nav { background: var(--ok-soft); color: var(--ok); }
.c-ene { background: var(--warn-soft); color: var(--warn); } .c-esp { background: var(--rescue-soft); color: var(--rescue); }
.c-afi { background: var(--rock-soft); color: var(--rock); } .c-des { background: var(--panel2); color: var(--muted); border: 1px dashed var(--line); }
.c-ex { background: var(--bad-soft); color: var(--bad); } .c-test { background: var(--ice); color: var(--panel); }

/* Semana */
.wk-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.wk-nav .arrow { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 1.2rem; }
.wk-nav .arrow:disabled { opacity: .35; cursor: default; }
.wk-title { flex: 1; min-width: 0; display: grid; gap: 2px; }
.wk-title h2 { font-size: 1.9rem; }
.wk-title .r { font: 500 .85rem var(--f-data); color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 7px 12px; cursor: pointer; font-weight: 600; font-size: .9rem; }
.btn.pri { background: var(--rescue); border-color: var(--rescue); color: var(--panel); }
.wk-sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.wk-sum div { background: var(--panel); padding: 10px 12px; display: grid; gap: 2px; }
.wk-sum b { font: 700 1.5rem var(--f-display); font-variant-numeric: tabular-nums; }
.wk-sum span { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.peso-sem { display: grid; grid-template-columns: auto 6.5em minmax(0, 1fr); gap: 6px 14px; align-items: center; padding: 10px 14px; }
.peso-sem label { display: grid; } .peso-sem small { color: var(--muted); font-size: .76rem; }
.peso-sem input { font: 600 1.1rem var(--f-data); padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); width: 100%; }
@media (max-width: 560px) { .peso-sem { grid-template-columns: auto 6.5em; } .peso-sem .estado-g { grid-column: 1 / 3; } }
.wk-notes { display: flex; flex-wrap: wrap; gap: 6px; }
.days { display: grid; gap: 10px; }
.day { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.day.today { border-color: var(--rescue); box-shadow: 0 0 0 1px var(--rescue); }
.day-h { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; width: 100%; background: none; border: 0; text-align: left; }
.day-h .dn { font: 700 1.25rem var(--f-display); text-transform: uppercase; width: 3.2em; }
.day-h .dd { font: 500 .78rem var(--f-data); color: var(--muted); width: 4.2em; }
.day-h .ses { flex: 1; min-width: 0; display: flex; gap: 5px; flex-wrap: wrap; }
.day-h .prog { font: 500 .75rem var(--f-data); color: var(--muted); }
.day-h .car { color: var(--muted); transition: transform .15s; }
.day.open .car { transform: rotate(90deg); }
.pill { font: 600 .78rem var(--f-body); padding: 2px 8px; border-radius: 3px; white-space: nowrap; }
.t-fuerza { background: var(--rescue-soft); color: var(--rescue); } .t-agua { background: var(--ice-soft); color: var(--ice); }
.t-roca { background: var(--rock-soft); color: var(--rock); } .t-monte { background: var(--ok-soft); color: var(--ok); }
.t-test { background: var(--ice); color: var(--panel); } .t-suave, .t-aux { background: var(--panel2); color: var(--muted); }
.t-desc { background: transparent; color: var(--muted); border: 1px dashed var(--line); } .t-clase { background: var(--panel2); color: var(--muted); }
.t-examen { background: var(--bad-soft); color: var(--bad); }
.pill.done { text-decoration: line-through; opacity: .6; }
.day-b { display: none; padding: 0 14px 14px; gap: 12px; }
.day.open .day-b { display: grid; }
.sesion { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.ses-h { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--panel2); flex-wrap: wrap; }
.ses-h h3 { flex: 1; min-width: 10em; }
.ses-h .hh { font: 500 .78rem var(--f-data); color: var(--muted); }
.check { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: .85rem; cursor: pointer; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); }
.check input { width: 18px; height: 18px; accent-color: var(--ok); }
.check.on { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.ses-nota { padding: 8px 12px; font-size: .88rem; color: var(--warn); background: var(--warn-soft); }
.blq { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 12px; border-top: 1px solid var(--line); align-items: start; }
.blq .ill { grid-row: span 2; width: 64px; height: 54px; border-radius: 4px; background: var(--panel2); cursor: pointer; border: 0; padding: 0; }
.blq .ill svg { width: 100%; height: 100%; display: block; }
.blq .ill.none { cursor: default; display: grid; place-items: center; color: var(--muted); font: 700 1.1rem var(--f-display); }
.blq .nom { font-weight: 700; }
.blq .dos { font: 500 .82rem var(--f-data); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.blq .como { grid-column: 2 / 4; font-size: .88rem; color: var(--muted); }
.clase-row { display: flex; gap: 10px; align-items: baseline; font-size: .88rem; color: var(--muted); padding: 2px 2px; }
.clase-row .hh { font: 500 .78rem var(--f-data); }

/* Ejercicios */
.filtros { display: flex; gap: 6px; flex-wrap: wrap; }
.filtros button { border: 1px solid var(--line); background: var(--panel); padding: 5px 11px; border-radius: 20px; font-weight: 600; font-size: .85rem; cursor: pointer; }
.filtros button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.ejs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 14px; }
.ej { padding: 14px; display: grid; gap: 10px; align-content: start; scroll-margin-top: 80px; }
.ej.flash { outline: 2px solid var(--rescue); }
.ej .fig { background: var(--panel2); border-radius: 4px; }
.ej .fig svg { width: 100%; height: auto; display: block; }
.ej h3 { font-size: 1.3rem; text-transform: uppercase; }
.ej .para { font: 600 .72rem var(--f-body); text-transform: uppercase; letter-spacing: .07em; color: var(--rescue); }
.ej ul { margin: 0; padding-left: 1.1em; font-size: .9rem; display: grid; gap: 3px; }
.ej .mal { color: var(--bad); font-size: .85rem; }

/* Registro */
.reg-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.reg-top select { font: 600 1rem var(--f-body); padding: 7px 10px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.grupos { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.grupo { padding: 14px; display: grid; gap: 10px; align-content: start; }
.grupo h3 { font-size: 1.25rem; text-transform: uppercase; display: flex; justify-content: space-between; align-items: baseline; }
.campo { display: grid; grid-template-columns: minmax(0, 1fr) 7.5em; gap: 8px; align-items: center; }
.campo label { font-size: .9rem; }
.campo label small { display: block; color: var(--muted); font-size: .76rem; }
.campo input, .campo select { width: 100%; font: 500 .95rem var(--f-data); padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); }
.campo.ok input, .campo.ok select { border-color: var(--ok); }
.reg-foot { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; position: sticky; bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); padding-block: 10px; }
.estado-g { font-size: .88rem; color: var(--muted); }
.protocolo { padding: 14px 16px; display: grid; gap: 6px; }
.protocolo ol { margin: 0; padding-left: 1.2em; display: grid; gap: 3px; font-size: .92rem; }

/* Progreso */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { padding: 12px 14px; display: grid; gap: 2px; }
.tile b { font: 700 2rem var(--f-display); font-variant-numeric: tabular-nums; }
.tile span { font-size: .8rem; color: var(--muted); }
.charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 14px; }
.chart { padding: 12px 14px 8px; display: grid; gap: 4px; position: relative; }
.chart h3 { font-size: 1.1rem; }
.chart .sub { font: 500 .75rem var(--f-data); color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .axis text { fill: var(--muted); font: 500 10px var(--f-data); }
.chart .meta line { stroke: var(--ok); stroke-width: 1.5; stroke-dasharray: 5 4; }
.chart .meta text { fill: var(--ok); font: 600 10px var(--f-body); }
.chart .serie { fill: none; stroke: var(--ice); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .pt { fill: var(--ice); stroke: var(--panel); stroke-width: 2; }
.chart .pt.hi { r: 6; }
.chart .last { fill: var(--ink); font: 600 11px var(--f-data); }
.chart .empty { fill: var(--muted); font: 500 12px var(--f-body); }
.chart .hit { fill: transparent; cursor: crosshair; }
.chart .cross { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--panel); font: 500 .78rem var(--f-data); padding: 5px 8px; border-radius: 4px; white-space: nowrap; transform: translate(-50%, -110%); z-index: 2; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 .72rem var(--f-body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); white-space: nowrap; }
td.n, th.n { font-family: var(--f-data); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.ok-t { color: var(--ok); font-weight: 700; } .no-t { color: var(--bad); font-weight: 700; } .na-t { color: var(--muted); }
.aviso { background: var(--warn-soft); border-left: 4px solid var(--warn); padding: 10px 14px; border-radius: 4px; font-size: .92rem; }
dialog { border: 0; border-radius: 8px; padding: 0; max-width: min(560px, calc(100vw - 32px)); background: var(--panel); color: var(--ink); }
dialog::backdrop { background: rgba(10, 16, 22, .55); }
.dlg { padding: 16px; display: grid; gap: 10px; }
.dlg .x { justify-self: end; }
@media (max-width: 560px) {
  .blq { grid-template-columns: 56px minmax(0, 1fr); }
  .blq .ill { width: 56px; height: 48px; }
  .blq .dos { grid-column: 2; text-align: left; }
  .blq .como { grid-column: 1 / 3; }
  .day-h .dd { display: none; }
  .wk-title h2 { font-size: 1.5rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

const faseDe = ds => FASES.find(f => ds >= f.ini && ds <= f.fin) || FASES[FASES.length - 1];
const DESCARGA = new Set([3, 15, 23, 27, 31]);
const SEMANA_SANTA = 19;
function semInfo(i) {
  const lunes = addD(START, i * 7), ds = ymd(lunes), f = faseDe(ymd(addD(lunes, 3)));
  const k = Math.floor((lunes - parseD(f.ini)) / 6048e5); // semana dentro de la fase
  const des = DESCARGA.has(i);
  const kg = { base: [5, 6, 6, 6, 7][Math.min(k, 4)], pre: 6, nav: 8, ene: 6, esp: Math.min(10, 8 + Math.floor(k / 3)), afi: 10 }[f.id];
  const desniv = { base: [900, 1000, 1100, 800, 1200][Math.min(k, 4)], pre: 800, nav: [1100, 1250, 1400][Math.min(k, 2)], ene: 700,
    esp: Math.min(1500, 1200 + k * 40), afi: 1500 }[f.id];
  return { i, lunes, ds, f, k, des, ss: i === SEMANA_SANTA, kg: des ? kg - 1 : kg, desniv: des ? Math.round(desniv * 0.6 / 50) * 50 : desniv };
}

  return `<div class="panel chart pchart"><h3>Peso semanal</h3>
    <div class="sub"><span>kg · franja verde: subida limpia de 0,25–0,5 kg/mes hasta abril, luego mantener</span>${last ? `<span>${fmtKg(last.v)} kg</span>` : ''}</div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Peso semanal frente a la franja objetivo">
      <polygon points="${band}" fill="var(--ok-soft)" stroke="var(--ok)" stroke-width="1" stroke-opacity=".5"/>
      <g class="grid">${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/>`).join('')}</g>
      <g class="axis">${ticks.map(t => `<text x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${t}</text>`).join('')}
        ${meses.map(p => `<text x="${x(p.i)}" y="${H - 6}" text-anchor="middle">${MES[p.d.getMonth()]}</text>`).join('')}</g>
      ${path ? `<path class="serie" d="${path}"/>${pts.filter(p => p.v != null).map(p => `<circle class="pt" cx="${x(p.i)}" cy="${y(p.v)}" r="4"/>`).join('')}
        <text class="last" x="${x(last.i)}" y="${y(last.v) - 9}" text-anchor="middle">${fmtKg(last.v)}</text>`
        : `<text class="empty" x="${(L + W - R) / 2}" y="${H / 2}" text-anchor="middle">Apunta tu peso cada semana en la pestaña Semana</text>`}
      <line class="cross" x1="0" x2="0" y1="${T}" y2="${H - Bt}" visibility="hidden"/>
      ${pts.map(p => `<rect class="hit" data-i="${p.i}" data-x="${x(p.i)}" data-y="${y(p.v != null ? p.v : (p.f[0] + p.f[1]) / 2)}" x="${x(p.i) - (W - L - R) / (2 * (n - 1))}" y="0" width="${(W - L - R) / (n - 1)}" height="${H}"/>`).join('')}
    </svg></div>`;
}

/* ================== descargar app y datos ================== */
// Solo se aceptan meses del plan, claves de marca conocidas y números; las casillas, solo "fecha:sesión".
function limpiar(obj) {
  const reg = {}, hechos = {}, claves = new Set(M.map(m => m.k));
  const r = obj && typeof obj.reg === 'object' ? obj.reg : {}, h = obj && typeof obj.hechos === 'object' ? obj.hechos : {};
  MESES_REG.forEach(mes => { const x = r[mes]; if (!x || typeof x.v !== 'object') return; const v = {};
    Object.keys(x.v).forEach(k => { const n = Number(x.v[k]); if (claves.has(k) && isFinite(n)) v[k] = n; });
    if (Object.keys(v).length) reg[mes] = { mes, v, ts: Number(x.ts) || Date.now() }; });
  Object.keys(h).forEach(k => { if (/^\d{4}-\d{2}-\d{2}:[a-z0-9]+$/.test(k)) hechos[k] = 1; });
  const pesos = {}, p = obj && typeof obj.pesos === 'object' ? obj.pesos : {};
  Object.keys(p).forEach(k => { const n = Number(p[k]); if (/^\d{4}-\d{2}-\d{2}$/.test(k) && n >= 40 && n <= 150) pesos[k] = n; });
  return { reg, hechos, pesos };
}
const datosJSON = () => JSON.stringify({ app: 'entreno-caem', version: 1, exportado: new Date().toISOString(), reg: REG, hechos: HECHOS, pesos: PESOS }, null, 1);
async function guardarArchivo(filename, data, tipo) {
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) {}
  if (dl) { try { await dl.save({ filename, data }); return 'Descargado.'; } catch (e) { return e && e.code === 'declined' ? 'Descarga cancelada.' : 'No se pudo descargar aquí.'; } }
  const url = URL.createObjectURL(new Blob([data], { type: tipo })), a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
  return 'Descargado.';
}
function abrirDescargas() {
  const dl = document.getElementById('dlg');
  document.getElementById('dlg-in').innerHTML = `<button class="btn x" id="dlg-x">Cerrar</button>
    <h2>Descargar</h2>
    <div class="panel protocolo"><h3>App para Chrome</h3>
      <p class="lead">Un archivo .html con toda la app y tus registros de ahora dentro. Ábrelo con Chrome (en el móvil, desde Descargas) y funciona sin abrir Claude. Lo que apuntes en esa copia se guarda en ese Chrome, no aquí.</p>
      <button class="btn pri" id="dApp">Descargar app (.html)</button></div>
    <div class="panel protocolo"><h3>Tus datos</h3>
      <p class="lead">Copia de seguridad de tus marcas y sesiones hechas. Sirve también para pasar los datos de la copia de Chrome a esta app, o al revés.</p>
      <div class="reg-top"><button class="btn" id="dJson">Descargar datos (.json)</button>
      <label class="btn" for="dImp">Cargar datos (.json)</label><input type="file" id="dImp" accept=".json,application/json" hidden></div></div>
    <p class="estado-g" id="dEst" role="status"></p>`;
  const est = t => document.getElementById('dEst').textContent = t;
  document.getElementById('dlg-x').onclick = () => dl.close();
  document.getElementById('dApp').onclick = async () => {
    const seed = `<script id="caem-seed">window.CAEM_SEED = ${JSON.stringify({ reg: REG, hechos: HECHOS, pesos: PESOS }).replace(/</g, '\\u003c')};<\/script>`;
    est(await guardarArchivo('entreno-caem.html', SRC.replace('<script id="app">', seed + '<script id="app">'), 'text/html'));
  };
  document.getElementById('dJson').onclick = async () => est(await guardarArchivo(`entreno-caem-datos-${ymd(new Date())}.json`, datosJSON(), 'application/json'));
  document.getElementById('dImp').onchange = async e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    let s; try { s = limpiar(JSON.parse(await f.text())); } catch (er) { est('Ese archivo no es una copia de Entreno CAEM.'); return; }
    const meses = Object.keys(s.reg);
    for (const mes of meses) await store.saveReg(mes, { ...(REG[mes] || {}), ...s.reg[mes], v: { ...((REG[mes] || {}).v || {}), ...s.reg[mes].v } });
    Object.assign(HECHOS, s.hechos); await store.saveHechosAhora();
    Object.assign(PESOS, s.pesos); store.savePesos();
    est(`Cargados ${meses.length} meses de registro y ${Object.keys(s.hechos).length} sesiones hechas.`); ruta();
  };
  try { dl.showModal(); } catch (er) {}
}
document.getElementById('bDescargar').onclick = abrirDescargas;

const VISTAS = { semana: renderSemana, ejercicios: renderEjercicios, registro: renderRegistro, progreso: renderProgreso, pruebas: renderPruebas };
function ruta() {
  const v = VISTAS[location.hash.slice(1)] ? location.hash.slice(1) : 'semana';
  Object.keys(VISTAS).forEach(k => document.getElementById('v-' + k).hidden = k !== v);
  document.querySelectorAll('nav.tabs a').forEach(a => a.classList.toggle('on', a.dataset.v === v));
  VISTAS[v]();
}
